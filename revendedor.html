<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUXUS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --gold:#c9a84c; --gold-light:#e8d48a; --gold-dark:#9a7535;
  --dark:#0c0c0e; --dark-2:#141417; --dark-3:#1e1e23;
  --text:#f0ece4; --text-muted:#8a8680; --text-dim:#5a5652;
  --border:rgba(201,168,76,.12); --border-hover:rgba(201,168,76,.35);
  --success:#34c77b; --danger:#e05555;
  --font:'Inter Tight',sans-serif;
}
[data-theme="light"] {
  --gold:#8a5e1a; --gold-light:#7a5218; --gold-dark:#5c3d10;
  --dark:#f8f5f0; --dark-2:#ffffff; --dark-3:#f0ece4;
  --text:#1a1410; --text-muted:#6b6358; --text-dim:#9a9280;
  --border:rgba(138,94,26,.18); --border-hover:rgba(138,94,26,.4);
}
[data-theme="light"] body { background:var(--dark); }
[data-theme="light"] .header { background:rgba(248,245,240,.95); }
[data-theme="light"] .hero { background:linear-gradient(160deg,#f5f0e8 0%,#ede8d8 60%,#f5f0e8 100%); }
[data-theme="light"] .hero::before { background:radial-gradient(circle,rgba(201,168,76,.12) 0%,transparent 70%); }
[data-theme="light"] .overlay { background:rgba(0,0,0,.6); }
[data-theme="light"] .modal { background:#fff; }
.theme-btn {
  width:32px; height:32px; border-radius:50%;
  background:var(--dark-3); border:1px solid var(--border);
  color:var(--text-muted); cursor:pointer; font-size:13px;
  display:flex; align-items:center; justify-content:center;
  transition:all .2s; flex-shrink:0;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--font); background:var(--dark); color:var(--text); min-height:100vh; }

/* Header */
.header {
  background:rgba(12,12,14,.92);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:1rem 1.5rem;
  display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:100;
}
.logo-wrap { display:flex; align-items:center; gap:10px; }
.logo-mark {
  width:36px; height:36px;
  background:linear-gradient(135deg,var(--gold-light) 0%,var(--gold) 50%,var(--gold-dark) 100%);
  border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:15px; color:#0c0c0e;
  letter-spacing:-.5px;
}
.logo-text { font-size:.95rem; font-weight:700; color:var(--text); letter-spacing:.08em; }
.logo-sub { font-size:9px; font-weight:400; color:var(--text-muted); letter-spacing:.15em; text-transform:uppercase; }
.header-right { text-align:right; }
.header-rev { font-size:13px; font-weight:600; color:var(--text); }
.header-date { font-size:10px; color:var(--text-muted); margin-top:1px; }

/* Hero */
.hero {
  background:linear-gradient(160deg,#0c0c0e 0%,#131208 60%,#0c0c0e 100%);
  padding:2rem 1.5rem 1.5rem;
  position:relative; overflow:hidden;
}
.hero::before {
  content:'';
  position:absolute; top:-60px; right:-60px;
  width:240px; height:240px;
  background:radial-gradient(circle,rgba(201,168,76,.08) 0%,transparent 70%);
  pointer-events:none;
}
.hero-greeting { font-size:11px; font-weight:500; color:var(--gold); letter-spacing:.12em; text-transform:uppercase; margin-bottom:6px; }
.hero-name { font-size:1.5rem; font-weight:800; color:var(--text); line-height:1.1; margin-bottom:4px; }
.hero-date { font-size:12px; color:var(--text-muted); }

/* Cards */
.cards { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:1.25rem 1.25rem 0; }
@media(max-width:380px){ .cards{ grid-template-columns:1fr 1fr; } }
.card {
  background:var(--dark-2);
  border:1px solid var(--border);
  border-radius:12px; padding:.875rem;
  position:relative; overflow:hidden;
  transition:border-color .2s;
}
.card::after {
  content:''; position:absolute;
  bottom:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:.4;
}
.card-label { font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:.12em; color:var(--text-muted); margin-bottom:5px; }
.card-value { font-size:1.35rem; font-weight:800; color:var(--text); line-height:1; }
.card-value.gold { color:var(--gold-light); }
.card-value.green { color:var(--success); }
.card-sub { font-size:9px; color:var(--text-dim); margin-top:3px; font-weight:400; }

/* Nav tabs */
.nav {
  display:flex; padding:1.25rem 1.25rem .75rem; gap:6px;
}
.nav-btn {
  flex:1; padding:.55rem .5rem;
  font-size:11px; font-weight:600; letter-spacing:.02em;
  background:var(--dark-3); border:1px solid var(--border);
  color:var(--text-muted); border-radius:8px; cursor:pointer;
  transition:all .2s; font-family:var(--font);
  display:flex; align-items:center; justify-content:center; gap:5px;
}
.nav-btn.active {
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold-dark) 100%);
  color:#0c0c0e; border-color:var(--gold); font-weight:700;
}

/* Section */
.section { padding:.75rem 1.25rem 2rem; }

/* Filtros */
.filtros { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:.875rem; }
.filtro {
  padding:4px 11px; font-size:10px; font-weight:600; letter-spacing:.03em;
  background:transparent; border:1px solid var(--border);
  color:var(--text-muted); border-radius:20px; cursor:pointer;
  transition:all .2s; font-family:var(--font);
}
.filtro.active { background:var(--gold); color:#0c0c0e; border-color:var(--gold); }

/* Search */
.search-wrap { position:relative; margin-bottom:.875rem; }
.search-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-dim); font-size:12px; }
.search {
  width:100%; padding:.6rem .875rem .6rem 2rem;
  background:var(--dark-3); border:1px solid var(--border);
  border-radius:8px; color:var(--text); font-size:12px;
  font-family:var(--font); transition:border-color .2s;
}
.search:focus { outline:none; border-color:rgba(201,168,76,.4); }
.search::placeholder { color:var(--text-dim); }

/* Category header */
.cat-head {
  display:flex; align-items:center; justify-content:space-between;
  padding:.35rem 6px; margin:.75rem 0 .3rem;
  border-bottom:1px solid var(--border);
}
.cat-head-name { font-size:10px; font-weight:700; color:var(--gold); text-transform:uppercase; letter-spacing:.1em; }
.cat-head-info { font-size:10px; color:var(--text-dim); }

/* Item card */
.item {
  background:var(--dark-2); border:1px solid var(--border);
  border-radius:10px; padding:.75rem .875rem;
  display:flex; align-items:center; gap:10px;
  margin-bottom:6px; cursor:pointer;
  transition:all .18s;
  position:relative; overflow:hidden;
}
.item::before {
  content:''; position:absolute; left:0; top:0; bottom:0; width:2px;
  background:linear-gradient(180deg,var(--gold-light),var(--gold-dark));
  opacity:0; transition:opacity .2s;
}
.item:hover { border-color:rgba(201,168,76,.3); }
.item:hover::before { opacity:1; }
.item:active { transform:scale(.99); }
.item-info { flex:1; min-width:0; }
.item-code { font-size:9px; font-weight:700; color:var(--gold); letter-spacing:.06em; margin-bottom:2px; }
.item-desc { font-size:12px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.item-cat { font-size:10px; color:var(--text-muted); margin-top:1px; }
.item-right { display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex-shrink:0; }
.item-price { font-size:13px; font-weight:700; color:var(--text); }
.item-badge {
  font-size:9px; font-weight:700; padding:2px 7px; border-radius:20px;
  letter-spacing:.03em; text-transform:uppercase;
}
.badge-em-maos { background:rgba(201,168,76,.1); color:var(--gold); border:1px solid rgba(201,168,76,.2); }
.badge-vendido { background:rgba(52,199,123,.1); color:var(--success); border:1px solid rgba(52,199,123,.25); }

/* Resumo */
.resumo-block {
  background:var(--dark-2); border:1px solid var(--border);
  border-radius:12px; overflow:hidden; margin-bottom:10px;
}
.resumo-row {
  display:flex; justify-content:space-between; align-items:center;
  padding:.75rem 1rem; border-bottom:1px solid var(--border);
}
.resumo-row:last-child { border-bottom:none; }
.resumo-label { font-size:11px; color:var(--text-muted); font-weight:400; }
.resumo-val { font-size:13px; font-weight:700; color:var(--text); }
.resumo-val.gold { color:var(--gold-light); }
.resumo-val.green { color:var(--success); }

.cats-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:1rem; }
.cat-card {
  background:var(--dark-2); border:1px solid var(--border);
  border-radius:10px; padding:.875rem;
}
.cat-card-name { font-size:10px; font-weight:700; color:var(--gold); text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px; }
.cat-card-n { font-size:1.2rem; font-weight:800; color:var(--text); line-height:1; }
.cat-card-val { font-size:11px; color:var(--text-muted); margin-top:2px; }

/* Documento */
.doc-card {
  background:var(--dark-2); border:1px solid var(--border);
  border-radius:16px; padding:2rem 1.5rem; text-align:center;
}
.doc-icon {
  width:64px; height:64px; margin:0 auto 1.25rem;
  background:linear-gradient(135deg,rgba(201,168,76,.15),rgba(201,168,76,.05));
  border:1px solid rgba(201,168,76,.2); border-radius:16px;
  display:flex; align-items:center; justify-content:center;
  font-size:1.5rem; color:var(--gold);
}
.doc-title { font-size:1rem; font-weight:700; color:var(--text); margin-bottom:.5rem; }
.doc-sub { font-size:12px; color:var(--text-muted); line-height:1.6; margin-bottom:1.5rem; }
.btn-primary {
  display:inline-flex; align-items:center; gap:8px;
  background:linear-gradient(135deg,var(--gold-light),var(--gold),var(--gold-dark));
  color:#0c0c0e; border:none; border-radius:10px;
  padding:.75rem 1.75rem; font-size:12px; font-weight:700;
  letter-spacing:.04em; cursor:pointer; font-family:var(--font);
  text-decoration:none; transition:opacity .2s;
}
.btn-primary:hover { opacity:.88; }
.btn-ghost {
  display:inline-flex; align-items:center; gap:7px;
  background:transparent; border:1px solid var(--border);
  color:var(--text-muted); border-radius:10px;
  padding:.75rem 1.75rem; font-size:12px; font-weight:500;
  cursor:pointer; font-family:var(--font); transition:all .2s;
  margin-top:.625rem;
}
.btn-ghost:hover { border-color:rgba(201,168,76,.35); color:var(--gold); }

/* Modal */
.overlay {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,.88); backdrop-filter:blur(8px);
  z-index:200; align-items:flex-end; justify-content:center;
}
@media(min-width:480px){ .overlay{ align-items:center; padding:1rem; } }
.overlay.open { display:flex; }
.modal {
  background:var(--dark-2); border:1px solid var(--border);
  border-radius:20px 20px 0 0; width:100%; max-width:420px;
  padding:1.5rem; animation:up .22s ease;
}
@media(min-width:480px){ .modal{ border-radius:20px; } }
@keyframes up { from{transform:translateY(24px);opacity:0;} to{transform:translateY(0);opacity:1;} }
.modal-bar { width:36px; height:3px; background:var(--border); border-radius:2px; margin:0 auto .75rem; }
.modal-title { font-size:1rem; font-weight:700; color:var(--text); margin-bottom:1rem; }
.modal-item-box {
  background:var(--dark-3); border:1px solid var(--border);
  border-radius:10px; padding:1rem; margin-bottom:1rem;
}
.modal-item-code { font-size:10px; font-weight:700; color:var(--gold); letter-spacing:.06em; margin-bottom:3px; }
.modal-item-desc { font-size:14px; font-weight:700; color:var(--text); margin-bottom:2px; }
.modal-item-cat { font-size:11px; color:var(--text-muted); }
.modal-row { display:flex; justify-content:space-between; align-items:center; padding:.5rem 0; border-bottom:1px solid var(--border); }
.modal-row:last-child { border-bottom:none; }
.modal-row-l { font-size:11px; color:var(--text-muted); }
.modal-row-r { font-size:13px; font-weight:700; color:var(--text); }
.modal-row-r.gold { color:var(--gold-light); font-size:1rem; }
.btn-confirm {
  width:100%; padding:.9rem; margin-top:1.25rem;
  background:linear-gradient(135deg,#34c77b,#27a862);
  border:none; border-radius:12px; color:white;
  font-size:13px; font-weight:700; letter-spacing:.04em;
  cursor:pointer; font-family:var(--font);
  display:flex; align-items:center; justify-content:center; gap:8px;
  transition:opacity .2s;
}
.btn-confirm:hover { opacity:.88; }
.btn-confirm:disabled { opacity:.45; cursor:not-allowed; }
.btn-cancel {
  width:100%; padding:.75rem; margin-top:.5rem;
  background:transparent; border:1px solid var(--border);
  color:var(--text-muted); border-radius:12px;
  font-size:12px; font-weight:500; cursor:pointer; font-family:var(--font);
}

/* Toast */
.toast {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:var(--dark-3); border:1px solid var(--border);
  color:var(--text); padding:.7rem 1.25rem; border-radius:10px;
  font-size:12px; font-weight:500; z-index:9999;
  opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap;
}
.toast.show { opacity:1; }
.toast.ok { border-color:rgba(52,199,123,.35); color:var(--success); }
.toast.err { border-color:rgba(224,85,85,.35); color:var(--danger); }

.empty { text-align:center; padding:3rem 1rem; }
.empty-icon { font-size:2rem; color:var(--border); margin-bottom:.75rem; }
.empty-text { font-size:13px; color:var(--text-dim); }

/* Loading */
#loading { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:14px; background:var(--dark); }
.spinner { width:36px; height:36px; border:2px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin .7s linear infinite; }
@keyframes spin { to{transform:rotate(360deg);} }
.loading-text { font-size:12px; color:var(--text-muted); font-weight:500; letter-spacing:.04em; }
</style>
</head>
<body>

<div id="loading">
  <div style="margin-bottom:.5rem;">
    <div style="width:44px;height:44px;background:linear-gradient(135deg,#e8d48a,#c9a84c,#9a7535);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#0c0c0e;margin:0 auto .75rem;">L</div>
  </div>
  <div class="spinner"></div>
  <div class="loading-text">Carregando sua maleta...</div>
</div>

<div id="app" style="display:none;">

  <div class="header">
    <div class="logo-wrap">
      <div class="logo-mark">L</div>
      <div>
        <div class="logo-text">LUXUS</div>
        <div class="logo-sub">Joias & Perfumes</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="Alternar tema"><i class="fas fa-moon" id="theme-icon"></i></button>
      <div class="header-right">
        <div class="header-rev" id="h-rev"></div>
        <div class="header-date" id="h-clock"></div>
      </div>
    </div>
  </div>

  <div class="hero">
    <div class="hero-greeting">Sua maleta</div>
    <div class="hero-name" id="hero-name"></div>
    <div class="hero-date" id="hero-date"></div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-label">Itens</div>
      <div class="card-value gold" id="c-total">0</div>
      <div class="card-sub">em mãos</div>
    </div>
    <div class="card">
      <div class="card-label">Valor</div>
      <div class="card-value gold" id="c-valor" style="font-size:1rem;">—</div>
      <div class="card-sub">total</div>
    </div>
    <div class="card">
      <div class="card-label">Vendas</div>
      <div class="card-value green" id="c-vend">0</div>
      <div class="card-sub">hoje</div>
    </div>
  </div>

  <div class="nav">
    <button class="nav-btn active" onclick="tab('itens')"><i class="fas fa-gem"></i>Maleta</button>
    <button class="nav-btn" onclick="tab('resumo')"><i class="fas fa-chart-pie"></i>Resumo</button>
    <button class="nav-btn" onclick="tab('doc')"><i class="fas fa-file-pdf"></i>Documento</button>
  </div>

  <div id="t-itens" class="section">
    <div class="filtros" id="filtros"></div>
    <div class="search-wrap">
      <i class="fas fa-search search-icon"></i>
      <input type="text" class="search" placeholder="Buscar código ou descrição..." id="busca" oninput="renderItens()">
    </div>
    <div id="lista"></div>
  </div>

  <div id="t-resumo" class="section" style="display:none;">
    <div class="resumo-block">
      <div class="resumo-row"><span class="resumo-label">Total consignado</span><span class="resumo-val" id="r-n">0</span></div>
      <div class="resumo-row"><span class="resumo-label">Valor total</span><span class="resumo-val gold" id="r-v">—</span></div>
      <div class="resumo-row"><span class="resumo-label">Vendidos (sessão)</span><span class="resumo-val green" id="r-vd">0</span></div>
      <div class="resumo-row"><span class="resumo-label">Ainda em mãos</span><span class="resumo-val" id="r-rest">0</span></div>
    </div>
    <div style="font-size:10px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.625rem;">Por categoria</div>
    <div class="cats-grid" id="cats-grid"></div>
  </div>

  <div id="t-doc" class="section" style="display:none;">
    <div class="doc-card">
      <div class="doc-icon"><i class="fas fa-file-signature"></i></div>
      <div class="doc-title">Documento de Entrega</div>
      <div class="doc-sub" id="doc-sub">Carregando...</div>
      <div id="doc-btns"></div>
    </div>
  </div>

</div>

<!-- Modal -->
<div class="overlay" id="modal">
  <div class="modal">
    <div class="modal-bar"></div>
    <div class="modal-title">Confirmar Venda</div>
    <div class="modal-item-box">
      <div class="modal-item-code" id="m-code"></div>
      <div class="modal-item-desc" id="m-desc"></div>
      <div class="modal-item-cat" id="m-cat"></div>
    </div>
    <div class="modal-row">
      <span class="modal-row-l">Preço de venda</span>
      <input id="m-price" type="number" step="0.01" min="0"
        style="background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--gold-light);font-size:1rem;font-weight:700;font-family:var(--font);text-align:right;width:120px;outline:none;padding:2px 0;"
        onfocus="this.style.borderColor='var(--gold)'" onblur="this.style.borderColor='var(--border)'">
    </div>
    <div class="modal-row"><span class="modal-row-l">Data</span><span class="modal-row-r" id="m-date"></span></div>
    <button class="btn-confirm" id="btn-ok" onclick="confirmar()"><i class="fas fa-check-circle"></i>Confirmar Venda</button>
    <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var SCRIPT='https://script.google.com/macros/s/AKfycbwQ4bVp3C3G5g34OsYb1Tr6nAtUgnN22Ln-bbetgpZe3-3-48KyzgtIDmhoQHlYyE7U/exec';
var itens=[],vendidos=[],rev=null,reciboUrl=null,filtro='todos',sel=null;

function toggleTheme(){
  var html=document.documentElement;
  var isDark=html.getAttribute('data-theme')!=='light';
  html.setAttribute('data-theme', isDark?'light':'dark');
  document.getElementById('theme-icon').className=isDark?'fas fa-sun':'fas fa-moon';
  localStorage.setItem('luxus_rev_theme', isDark?'light':'dark');
}
// Aplica tema salvo
(function(){
  var saved=localStorage.getItem('luxus_rev_theme');
  if(saved==='light'){
    document.documentElement.setAttribute('data-theme','light');
    document.addEventListener('DOMContentLoaded',function(){
      var icon=document.getElementById('theme-icon');
      if(icon) icon.className='fas fa-sun';
    });
  }
})();

function gerarFavicon(iniciais){
  var c=document.createElement('canvas');
  c.width=64; c.height=64;
  var ctx=c.getContext('2d');
  // Fundo gradiente dourado
  var g=ctx.createLinearGradient(0,0,64,64);
  g.addColorStop(0,'#e8d48a'); g.addColorStop(.5,'#c9a84c'); g.addColorStop(1,'#9a7535');
  ctx.fillStyle=g;
  ctx.roundRect(0,0,64,64,12);
  ctx.fill();
  // Texto
  ctx.fillStyle='#0c0c0e';
  ctx.font='bold 26px Inter Tight, sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(iniciais,32,33);
  // Aplica como favicon
  var link=document.querySelector('link[rel="icon"]')||document.createElement('link');
  link.rel='icon'; link.type='image/png'; link.href=c.toDataURL();
  document.head.appendChild(link);
}

function fmt(v){ return 'R$ '+(parseFloat(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function toast(msg,t){ var el=document.getElementById('toast'); el.textContent=msg; el.className='toast '+(t||''); el.classList.add('show'); setTimeout(function(){el.classList.remove('show');},3000); }
function getToken(){ return new URLSearchParams(window.location.search).get('token')||''; }

// Relógio no header
function atualizarRelogio(){
  var el=document.getElementById('h-clock'); if(!el) return;
  var now=new Date();
  el.textContent=now.toLocaleDateString('pt-BR')+' · '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
setInterval(atualizarRelogio,1000);
atualizarRelogio();

function tab(id){
  ['itens','resumo','doc'].forEach(function(t){document.getElementById('t-'+t).style.display=t===id?'':'none';});
  document.querySelectorAll('.nav-btn').forEach(function(b,i){b.classList.toggle('active',['itens','resumo','doc'][i]===id);});
  if(id==='resumo') renderResumo();
  if(id==='doc') renderDoc();
}

function init(){
  var token=getToken();
  if(!token){ erro('Link inválido.'); return; }
  var ini=token.slice(0,2).toUpperCase();
  var cpf6=token.slice(2);

  fetch(SCRIPT+'?action=getTudo',{method:'GET',cache:'no-cache'})
  .then(function(r){return r.json();})
  .then(function(d){
    var inv=d.inventory||[], revs=d.revendedores||[], mals=d.maletas||[];

    rev=revs.find(function(r){
      var c=(r.CPF||'').replace(/\D/g,'');
      var p=r.Nome.split(' ');
      var i=(p[0][0]+(p[p.length-1][0]||'')).toUpperCase();
      return i===ini && c.slice(0,6)===cpf6;
    });

    if(!rev){ erro('Acesso não autorizado.'); return; }

    // Favicon com iniciais
    var partes=rev.Nome.split(' ');
    var iniciais=(partes[0][0]+(partes[partes.length-1][0]||'')).toUpperCase();
    gerarFavicon(iniciais);
    var firstName=partes[0];
    document.title=firstName+' | LUXUS';

    itens=inv.filter(function(i){ return (i.Status==='Consignado'||i.Status==='Em Maleta')&&i.Revendedor===rev.Nome; });

    var mal=mals.find(function(m){ return m.revendedor===rev.Nome; });
    if(mal) reciboUrl=mal.reciboUrl;

    document.getElementById('h-rev').textContent=rev.Nome;
    document.getElementById('hero-name').textContent='Olá, '+firstName+' ✨';
    var dataEnt=mal&&mal.dataCriacao?new Date(mal.dataCriacao).toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'}):'';
    document.getElementById('hero-date').textContent=dataEnt?'Entrega em '+dataEnt:'';

    renderCards(); renderItens();
    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.display='block';
  })
  .catch(function(e){ erro('Erro: '+e.message); });
}

function erro(msg){
  document.getElementById('loading').innerHTML='<div style="text-align:center;padding:2rem;">'
    +'<div style="width:56px;height:56px;background:linear-gradient(135deg,rgba(201,168,76,.15),rgba(201,168,76,.05));border:1px solid rgba(201,168,76,.2);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:#c9a84c;margin:0 auto 1rem;"><i class="fas fa-lock"></i></div>'
    +'<div style="color:#8a8680;font-size:13px;font-weight:500;max-width:260px;line-height:1.6;">'+msg+'</div></div>';
}

function renderCards(){
  document.getElementById('c-total').textContent=itens.length;
  document.getElementById('c-valor').textContent=fmt(itens.reduce(function(s,i){return s+(parseFloat(i.Venda)||0);},0));
  document.getElementById('c-vend').textContent=vendidos.length;
}

function renderFiltros(){
  var cats={};
  itens.forEach(function(i){var c=i.Categoria||'Outros';cats[c]=(cats[c]||0)+1;});
  var html='<button class="filtro '+(filtro==='todos'?'active':'')+'" onclick="setFiltro(\'todos\')">Todos ('+itens.length+')</button>';
  Object.keys(cats).sort().forEach(function(c){
    html+='<button class="filtro '+(filtro===c?'active':'')+'" onclick="setFiltro(\''+c+'\')">'+c+' ('+cats[c]+')</button>';
  });
  document.getElementById('filtros').innerHTML=html;
}

function setFiltro(c){ filtro=c; renderItens(); }

function renderItens(){
  renderFiltros();
  var q=(document.getElementById('busca').value||'').toLowerCase();
  var f=itens.filter(function(i){
    return(filtro==='todos'||i.Categoria===filtro)
      &&(!q||(i.Codigo||'').toLowerCase().indexOf(q)!==-1||(i.Descricao||'').toLowerCase().indexOf(q)!==-1);
  });
  var grupos={},ordem=[];
  f.forEach(function(i){var c=i.Categoria||'Outros';if(!grupos[c]){grupos[c]=[];ordem.push(c);}grupos[c].push(i);});
  ordem.sort();
  var el=document.getElementById('lista');
  if(!f.length){el.innerHTML='<div class="empty"><div class="empty-icon"><i class="fas fa-box-open"></i></div><div class="empty-text">Nenhum item encontrado.</div></div>';return;}
  var html='';
  ordem.forEach(function(cat){
    var sub=grupos[cat].reduce(function(s,x){return s+(parseFloat(x.Venda)||0);},0);
    html+='<div class="cat-head"><span class="cat-head-name">'+cat+'</span><span class="cat-head-info">'+grupos[cat].length+' · '+fmt(sub)+'</span></div>';
    grupos[cat].forEach(function(item){
      html+='<div class="item" onclick="abrirModal('+JSON.stringify(item).replace(/"/g,'&quot;')+')">'
        +'<div class="item-info">'
        +'<div class="item-code">'+(item.Codigo||'—')+'</div>'
        +'<div class="item-desc">'+(item.Descricao||'—')+'</div>'
        +'<div class="item-cat">'+(item.Tipo||'')+(item.Categoria?' · '+item.Categoria:'')+'</div>'
        +'</div>'
        +'<div class="item-right">'
        +'<div class="item-price">'+fmt(item.Venda||0)+'</div>'
        +'<span class="item-badge badge-em-maos">Em mãos</span>'
        +'</div>'
        +'</div>';
    });
  });
  el.innerHTML=html;
}

function renderResumo(){
  var n=itens.length, v=itens.reduce(function(s,i){return s+(parseFloat(i.Venda)||0);},0);
  document.getElementById('r-n').textContent=n;
  document.getElementById('r-v').textContent=fmt(v);
  document.getElementById('r-vd').textContent=vendidos.length;
  document.getElementById('r-rest').textContent=n-vendidos.length;
  var cats={};
  itens.forEach(function(i){var c=i.Categoria||'Outros';if(!cats[c])cats[c]={n:0,v:0};cats[c].n++;cats[c].v+=(parseFloat(i.Venda)||0);});
  var html='';
  Object.keys(cats).sort().forEach(function(c){
    html+='<div class="cat-card">'
      +'<div class="cat-card-name">'+c+'</div>'
      +'<div class="cat-card-n">'+cats[c].n+'</div>'
      +'<div class="cat-card-val">'+fmt(cats[c].v)+'</div>'
      +'</div>';
  });
  document.getElementById('cats-grid').innerHTML=html;
}

function renderDoc(){
  var sub=document.getElementById('doc-sub'), btns=document.getElementById('doc-btns');
  if(reciboUrl){
    sub.textContent='Seu documento de entrega assinado está disponível abaixo.';
    btns.innerHTML='<a href="'+reciboUrl+'" target="_blank" class="btn-primary"><i class="fas fa-eye"></i>Ver documento</a>'
      +'<br><button class="btn-ghost" onclick="window.open(\''+reciboUrl+'\',\'_blank\')"><i class="fas fa-download"></i>Baixar PDF</button>';
  } else {
    sub.textContent='Nenhum documento disponível ainda. Aguarde sua consultora.';
    btns.innerHTML='<div style="color:var(--text-dim);font-size:12px;display:flex;align-items:center;gap:6px;justify-content:center;"><i class="fas fa-clock"></i>Pendente</div>';
  }
}

function abrirModal(item){
  sel=item;
  document.getElementById('m-code').textContent=item.Codigo||'—';
  document.getElementById('m-desc').textContent=item.Descricao||'—';
  document.getElementById('m-cat').textContent=(item.Tipo||'')+(item.Categoria?' · '+item.Categoria:'');
  document.getElementById('m-price').value=(parseFloat(item.Venda)||0).toFixed(2);
  document.getElementById('m-date').textContent=new Date().toLocaleDateString('pt-BR')+' '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  var btn=document.getElementById('btn-ok');
  btn.disabled=false; btn.innerHTML='<i class="fas fa-check-circle"></i>Confirmar Venda';
  document.getElementById('modal').classList.add('open');
  setTimeout(function(){ document.getElementById('m-price').focus(); document.getElementById('m-price').select(); },200);
}

function closeModal(){ document.getElementById('modal').classList.remove('open'); sel=null; }

function confirmar(){
  if(!sel) return;
  var preco = parseFloat(document.getElementById('m-price').value)||0;
  var item = Object.assign({},sel,{VendaRealizada: preco});
  vendidos.push(item);
  itens=itens.filter(function(i){return i.rowId!==sel.rowId;});
  renderCards(); renderItens(); closeModal();
  toast('✓ Venda de '+fmt(preco)+' registrada!','ok');
}

document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
init();
</script>
</body>
</html>
